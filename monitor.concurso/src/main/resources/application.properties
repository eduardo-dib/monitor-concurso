quarkus.http.port=8080
mp.jwt.verify.issuer=concurso-monitor


quarkus.rest-client.querido-diario.url=${API_QUERIDO_DIARIO:https://api.queridodiario.ok.org.br}
quarkus.rest-client.goias-diario.url=${API_GOIAS:https://api.diariooficial.abc.go.gov.br}
quarkus.rest-client.mt-diario.url=${API_MT:https://api.iomat.mt.gov.br}
quarkus.rest-client.ms-diario.url=${API_MS:https://www.diariooficial.ms.gov.br}
quarkus.rest-client.es-diario.url=${API_ES:https://api.ioes.dio.es.gov.br}
quarkus.rest-client.mg-diario.url=${API_MG:https://www.jornalminasgerais.mg.gov.br}
quarkus.rest-client.sp-diario.url=${API_SP:https://do-api-web-search.doe.sp.gov.br}
quarkus.rest-client.am-diario.url=${API_AM:https://diario.imprensaoficial.am.gov.br}
quarkus.rest-client.pe-diario.url=${API_PE:https://diariooficial.cepe.com.br}

quarkus.swagger-ui.always-include=true


quarkus.micrometer.binder.http-server.histogram=true

quarkus.flyway.migrate-at-start=true

# Banco legado já existente
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0

# Opcional, mas recomendado
quarkus.flyway.validate-on-migrate=true


quarkus.hibernate-orm.database.generation=validate






app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}
app.contato.email=${APP_CONTATO_EMAIL:cardozoedudib@gmail.com}
app.beta.max-usuarios=${BETA_MAX_USUARIOS:-1}



# --- PERFIL DEV (Local) ---
%dev.quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.jdbc.url=${DEV_DB_URL}
%dev.quarkus.datasource.username=${DEV_DB_USER}
%dev.quarkus.datasource.password=${DEV_DB_PASSWORD}
%dev.monitoramento.intervalo-busca=${INTERVALO_BUSCA:30s}
%dev.monitoramento.busca-desde-criacao-alerta=${BUSCA_DESDE_CRIACAO_ALERTA:false}
%dev.app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}
%dev.app.contato.email=${APP_CONTATO_EMAIL:cardozoedudib@gmail.com}


# --- PERFIL HOMOLOG (Oracle Cloud - S1) ---
%homolog.quarkus.datasource.db-kind=postgresql
%homolog.quarkus.datasource.jdbc.url=${HOMOLOG_DB_URL}
%homolog.quarkus.datasource.username=${HOMOLOG_DB_USER}
%homolog.quarkus.datasource.password=${HOMOLOG_DB_PASSWORD}
%homolog.smallrye.jwt.sign.key.location=file:/deployments/keys/privateKey.pem
%homolog.mp.jwt.verify.publickey.location=file:/deployments/keys/publicKey.pem
%homolog.quarkus.mailer.mock=false
%homolog.monitoramento.intervalo-busca=${INTERVALO_BUSCA:5m}
%homolog.monitoramento.busca-desde-criacao-alerta=${BUSCA_DESDE_CRIACAO_ALERTA:false}
%homolog.app.frontend.url=${APP_FRONTEND_URL:https://vigiaconcursohomolog.duckdns.org}
%homolog.app.contato.email=${APP_CONTATO_EMAIL:vigiaconcursoshml@gmail.com}
%homolog.app.beta.max-usuarios=${BETA_MAX_USUARIOS:50}



# --- PERFIL PROD (Oracle Cloud - S2) ---
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${PROD_DB_URL}
%prod.quarkus.datasource.username=${PROD_DB_USER}
%prod.quarkus.datasource.password=${PROD_DB_PASSWORD}
%prod.monitoramento.intervalo-busca=${INTERVALO_BUSCA:1h}
%prod.monitoramento.busca-desde-criacao-alerta=${BUSCA_DESDE_CRIACAO_ALERTA:true}
%prod.app.frontend.url=${APP_FRONTEND_URL:https://SEU-PROJETO.vercel.app}
%prod.app.contato.email=${APP_CONTATO_EMAIL:}

# --- PERFIL TEST () ---
%test.quarkus.hibernate-orm.database.generation=drop-and-create

# ---Cookies e CORS --
mp.jwt.token.header=Cookie
mp.jwt.token.cookie=token
smallrye.jwt.always-check-authorization=true

app.jwt.cookie.secure=true
%dev.app.jwt.cookie.secure=false

quarkus.http.cors=true
quarkus.http.cors.credentials=true
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with

%dev.quarkus.http.cors.origins=http://localhost:5173
%homolog.quarkus.http.cors.origins=https://SEU-PROJETO.vercel.app
%prod.quarkus.http.cors.origins=https://SEU-PROJETO.vercel.app


quarkus.mailer.host=${SMTP_HOST}
quarkus.mailer.port=${SMTP_PORT}
quarkus.mailer.username=${SMTP_USER}
quarkus.mailer.password=${SMTP_PASSWORD}
quarkus.mailer.from=${MAIL_FROM}
quarkus.mailer.mock=false