name: Deploy na Nuvem Oracle


on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest 

    steps:
      # 1. Baixa o código-fonte do repositório
      - name: Checkout do Código
        uses: actions/checkout@v4

      # 2. Configura o Java 21 no servidor do GitHub
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Compila a aplicação Quarkus e gera o .jar na pasta target/
      - name: Compilar Projeto com Maven
        working-directory: ./monitor.concurso  # <-- Altere para o nome da sua pasta
        run: ./mvnw clean package -DskipTests

      # 4. Faz login no Docker Hub usando as credenciais do GitHub Secrets
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Cria a imagem Docker e envia (push) para o Docker Hub
      - name: Build e Push da Imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/monitor-concurso-api:latest

      # 6. Conecta na VM via SSH e atualiza o container
      - name: Deploy na VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/backend-homolog/monitor-concurso/monitor.concurso
            docker-compose pull
            docker-compose up -d
            docker image prune -f
