name: Deploy na Nuvem Oracle

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o código-fonte do repositório
      - name: Checkout do Código
        uses: actions/checkout@v4

      # ----------------------------------------------------
      # BACKEND: QUARKUS (JAVA 21)
      # ----------------------------------------------------
      # 2. Configura o Java 21 no servidor do GitHub
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Compila a aplicação Quarkus
      - name: Compilar Backend com Maven
        working-directory: ./monitor.concurso
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      # ----------------------------------------------------
      # DOCKER: LOGIN
      # ----------------------------------------------------
      # 4. Faz login no Docker Hub (Uma única vez para os dois builds)
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ----------------------------------------------------
      # DOCKER BUILD & PUSH: BACKEND E FRONTEND
      # ----------------------------------------------------
      # 5. Build e Push da Imagem da API Quarkus
      - name: Build e Push - Backend (Quarkus)
        uses: docker/build-push-action@v5
        with:
          context: ./monitor.concurso
          file: ./monitor.concurso/src/main/docker/Dockerfile.jvm
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/monitor-concurso-api:latest

      # 6. Build e Push da Imagem do Frontend (Vue 3 + Nginx)
      - name: Build e Push - Frontend (Vue 3)
        uses: docker/build-push-action@v5
        with:
          # ATENÇÃO: Ajuste a pasta para onde está o seu Vue no repositório!
          context: ./frontend 
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/monitor-concurso-web:latest

      # ----------------------------------------------------
      # DEPLOY NA VM VIA SSH
      # ----------------------------------------------------
      # 7. Conecta na VM e atualiza OS DOIS containers
      - name: Deploy na VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/backend-homolog/monitor-concurso/monitor.concurso
            docker compose pull
            docker compose up -d
            docker image prune -f
